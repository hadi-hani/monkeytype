  <body>
    <script type="module" async>
      import { loadCSS } from "./ts/utils/misc";
      loadCSS("/css/fa.min.css", true);
      document.getElementById("page404").classList.remove("hidden");
      document.getElementById("page404").classList.remove("hidden");
      document.querySelector("header").classList.add("focus");
      document.title = "404 Not Found | TypeHorizon";
    </script>
    <load src="html/warnings.html" />
    <style>
      h1 {
        font-weight: unset;
        font-size: 2rem;
        margin-top: 3rem;
        color: var(--sub-color);
      }
      header #logo .icon svg path {
        fill: var(--sub-color);
      }
      a.button {
        border-radius: var(--roundness);
        text-decoration: none;
        background: var(--sub-alt-color);
        color: var(--text-color);
        &:hover {
          background: var(--text-color);
          color: var(--bg-color);
        }
      }
      .page404 {
        display: grid;
        justify-content: center;
        height: 100%;
        align-content: center;
      }
      .page404 .content {
        display: grid;
        grid-auto-flow: column;
        gap: 4rem;
        grid-template-columns: 300px 300px;
      }
      .page404 .image {
        width: 100%;
        align-self: center;
        display: none;
        aspect-ratio: 300/199;
        background-size: contain;
        border-radius: var(--roundness);
      }

      .page404 .title {
        font-size: 5rem;
        line-height: 4rem;
        /* margin: -3rem; */
        color: var(--main-color);
        align-self: center;
      }

      .page404 .side {
        justify-items: center;
        display: grid;
        gap: 1rem;
        text-align: center;
      }
      .page404 .big {
        font-size: 10rem;
        line-height: 10rem;
        color: var(--sub-color);
      }

      .page404 .button {
        padding: 1rem 2rem;
        width: max-content;
      }
    </style>
    <div id="app" class="content-grid focus">
      <header class="focus">
        <a id="logo" href="/" router-link="">
          <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
              <rect x="4" y="4" width="56" height="56" rx="17" fill="currentColor" opacity="0.12"/>
              <path d="M12 47H52M18 37H46M23 29A9 9 0 0 1 41 29M32 11V18" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>
          <h1 class="text">
            <div class="top">typing practice</div>
            TypeHorizon
          </h1>
        </a>
      </header>
      <main style="height: 100%">
        <div class="page page404 hidden" id="page404">
          <div class="content">
            <div class="image"></div>
            <div class="side">
              <div class="title">404</div>
              <div>Ooops! Looks like this page or resource doesn't exist.</div>
              <a href="/" class="button" router-link>
                <i class="fas fa-home"></i>
                Go Home
              </a>
            </div>
          </div>
        </div>
      </main>
    </div>
