<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link
      rel="preload"
      href="/webfonts/RobotoMono-Regular.woff2"
      type="font/woff2"
      as="font"
      crossorigin
    />
    <link
      rel="preload"
      href="/webfonts/LexendDeca-Regular.woff2"
      type="font/woff2"
      as="font"
      crossorigin
    />

    <script>
      document.addEventListener("keydown", function (e) {
        if (e.key == "Escape") e.preventDefault();
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeHorizon | Typing practice</title>
    <!-- fallback theme colors -->
    <style>
      :root {
        --bg-color: #323437;
        --main-color: #e2b714;
        --caret-color: #e2b714;
        --sub-color: #646669;
        --sub-alt-color: #2c2e31;
        --text-color: #d1d0c5;
        --error-color: #ca4754;
        --error-extra-color: #7e2a33;
        --colorful-error-color: #ca4754;
        --colorful-error-extra-color: #7e2a33;
        --nav-focus-opacity: 0;
      }
    </style>
    <!-- last configured theme colors (theme controller), applied before the
    first paint to avoid an initial flash of the default theme (and the body
    background fading from it) -->
    <script>
      try {
        var cachedTheme = localStorage.getItem("firstPaintThemeCss");
        if (cachedTheme) {
          var style = document.createElement("style");
          style.textContent = cachedTheme;
          document.head.appendChild(style);
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/images/typehorizon-icon.svg" />
<link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon/apple-touch-icon.png"
    />
<meta name="msapplication-TileColor" content="#e2b714" />
<meta
      name="name"
      content="Monkeytype | A minimalistic, customizable typing test"
    />
    <meta name="description" content="TypeHorizon is an independently maintained typing-practice project based on the Monkeytype GPL-3.0 codebase." />
    <!-- <meta
    name="keywords"
    content="typing speed test, typing speedtest, typing test, speedtest, speed test, typing, test, typing-test, typing test, monkey-type, monkeytype, monkey type, monkey-types, monkeytypes, monkey types, types, monkey, type, miodec, wpm, words per minute, typing website, minimalistic, custom typing test, customizable, customisable, themes, random words, smooth caret, smooth, new, new typing site, new typing website, minimalist typing website, minimalistic typing website, minimalist typing test"

  /> -->
    <meta name="keywords" content="TypeHorizon, typing test, typing practice, typing speed, keyboard training" />
    <meta name="author" content="TypeHorizon contributors" />
    <meta property="og:title" content="TypeHorizon | Typing practice" />
    <meta property="og:type" content="website" />
<meta
      property="og:description"
      content="The most customizable typing test website with a minimal design and a ton of features. Test yourself in various modes, track your progress and improve your speed."
    />
    <meta name="twitter:title" content="TypeHorizon | Typing practice" />
<meta name="twitter:card" content="summary_large_image" />
    <meta name="darkreader-lock" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <style>
      /* 
      Layer order NEEDS to be here and one layer per line.
      This is because vite changes the order of the css imports,
      and the layer definition needs to be at the very very top, otherwise things break.
    */
      @layer normalize;
      @layer theme;
      @layer base;
      @layer components;
      @layer properties;
      @layer vendor;
      @layer custom-styles;
      @layer hidden;
      @layer utilities;
    </style>
    <link rel="stylesheet" class="testtesttest" href="styles/index.scss" />
    <link rel="stylesheet" class="testtest" href="styles/tailwind.css" />
    <link rel="stylesheet" class="test" href="styles/vendor.scss" />
  </head>

  <body class="loading">
    <!-- shown without js or css, so it can't be rendered by solid -->
    <load src="html/warnings.html" />
    <script
      src="https://www.google.com/recaptcha/api.js?render=explicit"
      async
      defer
    ></script>
    <!-- renders the app after the markup above -->
    <script type="module" src="ts/index.tsx"></script>
  </body>
</html>
